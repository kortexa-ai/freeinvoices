<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Social Preview</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    }
    
    /* Social preview dimensions: 1200x630 */
    .preview-container {
      width: 1200px;
      height: 630px;
      background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }
    
    /* Decorative elements */
    .preview-container::before {
      content: '';
      position: absolute;
      top: -200px;
      right: -200px;
      width: 600px;
      height: 600px;
      background: linear-gradient(135deg, rgba(37, 99, 235, 0.08) 0%, rgba(37, 99, 235, 0.02) 100%);
      border-radius: 50%;
    }
    
    .preview-container::after {
      content: '';
      position: absolute;
      bottom: -150px;
      left: -150px;
      width: 400px;
      height: 400px;
      background: linear-gradient(135deg, rgba(37, 99, 235, 0.06) 0%, rgba(37, 99, 235, 0.02) 100%);
      border-radius: 50%;
    }
    
    .content {
      text-align: center;
      z-index: 1;
      padding: 60px;
    }
    
    .brand {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      margin-bottom: 40px;
    }
    
    .logo-icon {
      width: 64px;
      height: 64px;
      background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 24px rgba(37, 99, 235, 0.3);
    }
    
    .logo-icon svg {
      width: 36px;
      height: 36px;
      color: white;
    }
    
    .brand-text {
      font-size: 42px;
      font-weight: 700;
      color: #1e293b;
      letter-spacing: -0.02em;
    }
    
    .brand-text span {
      color: #2563eb;
    }
    
    .tagline {
      font-size: 36px;
      font-weight: 600;
      color: #334155;
      margin-bottom: 24px;
      line-height: 1.3;
    }
    
    .description {
      font-size: 24px;
      color: #64748b;
      font-weight: 400;
    }
    
    .invoice-mockup {
      position: absolute;
      bottom: -80px;
      right: 60px;
      width: 320px;
      height: 420px;
      background: white;
      border-radius: 12px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
      padding: 24px;
      transform: rotate(-6deg);
      z-index: 0;
    }
    
    .mockup-header {
      height: 8px;
      background: #2563eb;
      border-radius: 4px;
      margin-bottom: 20px;
      width: 60%;
    }
    
    .mockup-line {
      height: 6px;
      background: #e2e8f0;
      border-radius: 3px;
      margin-bottom: 12px;
    }
    
    .mockup-line.short {
      width: 40%;
    }
    
    .mockup-line.medium {
      width: 70%;
    }
    
    .mockup-amount {
      margin-top: 40px;
      padding-top: 20px;
      border-top: 2px solid #e2e8f0;
    }
    
    .mockup-total {
      height: 20px;
      background: #2563eb;
      border-radius: 4px;
      width: 50%;
      margin-left: auto;
    }
  </style>
</head>
<body>
  <div class="preview-container">
    <div class="content">
      <div class="brand">
        <div class="logo-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
            <polyline points="14 2 14 8 20 8"/>
            <line x1="16" y1="13" x2="8" y2="13"/>
            <line x1="16" y1="17" x2="8" y2="17"/>
            <line x1="10" y1="9" x2="8" y2="9"/>
          </svg>
        </div>
        <div class="brand-text">Invoices by <span>kortexa.ai</span></div>
      </div>
      <div class="tagline">Create professional invoices<br>in seconds</div>
      <div class="description">Free, simple, and beautifully designed</div>
    </div>
    
    <div class="invoice-mockup">
      <div class="mockup-header"></div>
      <div class="mockup-line"></div>
      <div class="mockup-line short"></div>
      <div class="mockup-line medium"></div>
      <div class="mockup-line"></div>
      <div class="mockup-line short"></div>
      <div class="mockup-amount">
        <div class="mockup-total"></div>
      </div>
    </div>
  </div>
</body>
</html>
