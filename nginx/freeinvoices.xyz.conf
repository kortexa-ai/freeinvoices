server {
    listen 443 ssl;
    listen [::]:443 ssl;
    ssl_certificate /etc/letsencrypt/live/freeinvoices.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/freeinvoices.xyz/privkey.pem;
    server_name freeinvoices.xyz;
    root $src_root/freetools/freeinvoices/dist;
    index index.html;

    # Security headers - keep at server level only; a location-level
    # add_header would cancel inheritance of these.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Content-hashed Vite bundles: cache for a year. `expires` is used
    # instead of add_header so the security headers above still inherit.
    location /assets/ {
        expires 1y;
    }

    # Never cache the HTML shell so new deploys are picked up immediately
    location = /index.html {
        expires -1;
    }

    location = /sw.js {
        expires -1;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
