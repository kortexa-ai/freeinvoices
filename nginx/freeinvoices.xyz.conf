server {
    listen 443 ssl;
    listen [::]:443 ssl;
    ssl_certificate /etc/letsencrypt/live/freeinvoices.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/freeinvoices.xyz/privkey.pem;
    server_name freeinvoices.xyz;
    root $src_root/freetools/freeinvoices/dist;
    index index.html;

    # The shared edge map revalidates mutable files and only caches hashed assets.
    expires off;
    add_header Cache-Control $edge_asset_cache_control always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Missing assets must return 404 rather than the application shell.
    location /assets/ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    ssl_certificate /etc/letsencrypt/live/freeinvoices.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/freeinvoices.xyz/privkey.pem;
    server_name www.freeinvoices.xyz;
    return 301 https://freeinvoices.xyz$request_uri;
}
