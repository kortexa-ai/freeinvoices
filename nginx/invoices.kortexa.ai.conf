server {
    listen 443 ssl;
    listen [::]:443 ssl;
    ssl_certificate /etc/letsencrypt/live/invoices.kortexa.ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/invoices.kortexa.ai/privkey.pem;
    server_name invoices.kortexa.ai;
    root /home/francip/src/invoices/dist;
    index index.html;
    location / {
        try_files $uri $uri/ /index.html;
    }
}
